name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - name: Build release binary
        env:
          NEXUS_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
        run: NEXUS_VERSION="${GITHUB_REF_NAME#v}" bun ./packages/nexus/script/build.ts --single --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.target }}
          path: packages/nexus/dist/nexus-${{ matrix.target }}-*.tar.gz
      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/nexus/dist/nexus-${{ matrix.target }}-*.tar.gz
          fail_on_unmatched_files: true
