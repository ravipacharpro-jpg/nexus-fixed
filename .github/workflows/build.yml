name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun --cwd packages/nexus run script/build.ts --single --target=linux-arm64 2>&1 | tail -50
      - run: ls -lh packages/nexus/dist/ 2>&1 | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-arm64
          path: packages/nexus/dist/*
