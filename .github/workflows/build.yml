name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun ./packages/nexus/script/build.ts --single --target=linux-arm64 2>&1 | tail -100
      - run: ls -lh packages/nexus/dist/ 2>&1 | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-linux-arm64
          path: packages/nexus/dist/*
      - name: Attach binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/nexus/dist/*
          fail_on_unmatched_files: false
